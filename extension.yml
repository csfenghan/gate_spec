schema_version: "1.0"

extension:
  id: "gatespec"
  name: "GateSpec"
  version: "0.10.0"
  description: "Outcome-scoped gated requirements/design with Protocol v3 isolated test controls, bounded review, and final acceptance"
  category: "process"
  effect: "read-write"
  author: "harry.feng"
  repository: "https://github.com/harryfeng/gatespec"
  license: "MIT"

requires:
  speckit_version: ">=0.16.0,<0.17.0"
  commands:
    - "speckit.tasks"     # downstream convergence point (unchanged, upstream)
    - "speckit.analyze"   # unchanged native handoff after speckit.tasks
    - "speckit.implement" # unchanged native executor, surrounded by review gates
  scripts:
    - "setup-plan"           # reused by gatespec.plan

provides:
  commands:
    - name: "speckit.gatespec.specify"
      file: "commands/speckit.gatespec.specify.md"
      description: "Gated specify: scenario-first human decisions, technical deferral, explicit user approval"
      aliases: ["gatespec.specify"]

    - name: "speckit.gatespec.plan"
      file: "commands/speckit.gatespec.plan.md"
      description: "Gated plan: scenario-first human decisions with recorded engineering determinations"
      aliases: ["gatespec.plan"]

    - name: "speckit.gatespec.source-design"
      file: "commands/speckit.gatespec.source-design.md"
      description: "Optional source-level design with fresh review and explicit whole-design approval"
      aliases: ["gatespec.source-design"]

    - name: "speckit.gatespec.check"
      file: "commands/speckit.gatespec.check.md"
      description: "Run Requirements, Design, Source, task/review, or final acceptance checks for the current feature"
      aliases: ["gatespec.check"]

    - name: "speckit.gatespec.check-requirements"
      file: "commands/speckit.gatespec.check-requirements.md"
      description: "Internal fixed Requirements Gate hook entry"

    - name: "speckit.gatespec.check-design"
      file: "commands/speckit.gatespec.check-design.md"
      description: "Internal fixed Design Gate hook entry"

    - name: "speckit.gatespec.check-source-design"
      file: "commands/speckit.gatespec.check-source-design.md"
      description: "Internal conditional Source Design Gate hook entry"

    - name: "speckit.gatespec.check-tasks"
      file: "commands/speckit.gatespec.check-tasks.md"
      description: "Internal fixed post-tasks structure hook entry"

    - name: "speckit.gatespec.refine-tasks"
      file: "commands/speckit.gatespec.refine-tasks.md"
      description: "Internal fixed post-tasks closure audit and task-only refinement entry"

    - name: "speckit.gatespec.review-tasks"
      file: "commands/speckit.gatespec.review-tasks.md"
      description: "Fresh-context semantic review of native tasks after analyze"

    - name: "speckit.gatespec.review-source-design"
      file: "commands/speckit.gatespec.review-source-design.md"
      description: "Fresh-context REV-SOURCE review coordinator and manual request path"

    - name: "speckit.gatespec.check-task-review"
      file: "commands/speckit.gatespec.check-task-review.md"
      description: "Internal fixed task-review receipt hook entry"

    - name: "speckit.gatespec.review-implementation"
      file: "commands/speckit.gatespec.review-implementation.md"
      description: "Create or independently review an implementation checkpoint request"

    - name: "speckit.gatespec.check-implementation-review"
      file: "commands/speckit.gatespec.check-implementation-review.md"
      description: "Internal fixed implementation-review receipt hook entry"

    - name: "speckit.gatespec.accept-implementation"
      file: "commands/speckit.gatespec.accept-implementation.md"
      description: "Final whole-implementation user acceptance and bound local record"

hooks:
  # Fires when the CORE speckit.plan runs on a gatespec-track spec (mixed path).
  # gatespec.plan itself runs the spec check inline at startup.
  before_plan:
    command: "speckit.gatespec.check-requirements"
    optional: false
    description: "Requirements Gate: spec must be Approved-Requirements before planning"

  # Fires when core speckit.tasks runs — the mandatory convergence point
  # for both gatespec.plan and core speckit.plan outputs.
  before_tasks:
    - command: "speckit.gatespec.check-design"
      priority: 10
      optional: false
      description: "Design Gate: plan must be Approved-Design before task generation"
    - command: "speckit.gatespec.check-source-design"
      priority: 20
      optional: false
      description: "Conditional Source Design Gate: when enabled, Source and REV-SOURCE must be approved/current"

  # Native tasks.md remains upstream-generated. GateSpec first performs one
  # bounded task-only closure pass, then validates the resulting contract.
  after_tasks:
    - command: "speckit.gatespec.refine-tasks"
      priority: 10
      optional: false
      description: "Task Refinement: close the fixed task audit and prior-review findings without changing approved artifacts"
    - command: "speckit.gatespec.check-tasks"
      priority: 20
      optional: false
      description: "Task Structure Gate: native tasks and closure matrices must encode the approved review contract"

  # Native analyze remains the cross-artifact analysis step. Its completion is
  # followed by a separate fresh-context GateSpec task verdict.
  after_analyze:
    command: "speckit.gatespec.review-tasks"
    optional: false
    description: "Task Review: obtain a fresh-context PASS receipt after native analysis"

  before_implement:
    command: "speckit.gatespec.check-task-review"
    optional: false
    description: "Task Review Gate: a current REV-TASKS PASS seal is required before native implementation"

  after_implement:
    - command: "speckit.gatespec.check-implementation-review"
      priority: 10
      optional: false
      description: "Implementation Review Gate: a current REV-FINAL PASS seal is required before completion"
    - command: "speckit.gatespec.accept-implementation"
      priority: 20
      optional: false
      description: "Delivery Acceptance Gate: explicit user acceptance is required before completion"

tags:
  - "sdd"
  - "human-gate"
  - "requirements"
  - "design-review"
  - "implementation-review"
  - "source-design"
  - "delivery-acceptance"
  - "delivery-estimate"
  - "scope-contract"
  - "test-control"
  - "workflow"
